apiVersion: v1
kind: Namespace
metadata:
  name: localshops-dev
  labels:
    app.kubernetes.io/part-of: bhuplabs-local
    environment: development
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.34
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.34
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.34
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: localshops-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: localshops-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: localshops-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: localshops-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: session-redis
  namespace: localshops-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: database-maintenance
  namespace: localshops-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-resources
  namespace: localshops-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: localshops-dev-budget
  namespace: localshops-dev
spec:
  hard:
    requests.cpu: "750m"
    requests.memory: 1536Mi
    limits.cpu: "3"
    limits.memory: 3Gi
    requests.storage: 5Gi
    persistentvolumeclaims: "2"
    pods: "18"
    services: "8"
