apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: localshops
spec:
  schedule: "30 2 * * *"
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: bhuplabs-local
        spec:
          serviceAccountName: database-maintenance
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: dump
              image: docker.io/library/postgres@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
              imagePullPolicy: IfNotPresent
              command: ["sh", "-ec"]
              args:
                - |
                  umask 077
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  backup_file="/work/localshops-${timestamp}.dump"
                  pg_dump \
                    --host=postgres \
                    --username="$PGUSER" \
                    --dbname="$PGDATABASE" \
                    --format=custom \
                    --compress=6 \
                    --file="$backup_file"
                  pg_restore --list "$backup_file" >/dev/null
                  sha256sum "$backup_file" >"${backup_file}.sha256"
                  echo "Validated PostgreSQL dump: ${backup_file}"
              env:
                - {name: PGDATABASE, value: localshops}
                - {name: PGUSER, value: localshops}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: localshops-database, key: password}
              resources:
                requests: {cpu: 10m, memory: 64Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
                readOnlyRootFilesystem: true
              volumeMounts:
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: upload
              image: docker.io/rclone/rclone@sha256:6bed02519c75f58ddcc52f739da35b657042da1200c59ac1695e19bb911162a8
              imagePullPolicy: IfNotPresent
              command: ["sh", "-ec"]
              args:
                - |
                  rclone copy /work "oci:${BACKUP_BUCKET}/postgres" \
                    --include='localshops-*.dump' \
                    --include='localshops-*.dump.sha256'
                  rclone delete "oci:${BACKUP_BUCKET}/postgres" \
                    --min-age=30d \
                    --include='localshops-*.dump' \
                    --include='localshops-*.dump.sha256'
                  echo "Uploaded PostgreSQL backup to Object Storage"
              env:
                - {name: BACKUP_BUCKET, value: dukly-db-backups}
                - {name: RCLONE_CONFIG, value: /tmp/rclone.conf}
                - {name: RCLONE_CONFIG_OCI_TYPE, value: s3}
                - {name: RCLONE_CONFIG_OCI_PROVIDER, value: Other}
                - {name: RCLONE_CONFIG_OCI_ENV_AUTH, value: "true"}
                - {name: RCLONE_CONFIG_OCI_REGION, value: ap-hyderabad-1}
                - {name: RCLONE_CONFIG_OCI_ENDPOINT, value: https://axbcwhek7zcg.compat.objectstorage.ap-hyderabad-1.oraclecloud.com}
                # OCI's S3 compatibility endpoint rejects the AWS SDK's
                # streaming aws-chunked encoding used by PutObject.
                - {name: RCLONE_CONFIG_OCI_USE_PRESIGNED_REQUEST, value: "true"}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: {name: localshops-db-backups, key: access-key-id}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: localshops-db-backups, key: secret-access-key}
              resources:
                requests: {cpu: 10m, memory: 64Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
                readOnlyRootFilesystem: true
              volumeMounts:
                - {name: work, mountPath: /work, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: work
              emptyDir: {sizeLimit: 1Gi}
            - name: tmp
              emptyDir: {sizeLimit: 128Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-restore-check
  namespace: localshops
spec:
  schedule: "0 3 * * 0"
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-restore-check
            app.kubernetes.io/component: restore-check
            app.kubernetes.io/part-of: bhuplabs-local
        spec:
          serviceAccountName: database-maintenance
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: download
              image: docker.io/rclone/rclone@sha256:6bed02519c75f58ddcc52f739da35b657042da1200c59ac1695e19bb911162a8
              imagePullPolicy: IfNotPresent
              command: ["sh", "-ec"]
              args:
                - |
                  latest_backup="$(rclone lsf "oci:${BACKUP_BUCKET}/postgres" \
                    --files-only \
                    --include='localshops-*.dump' | sort | tail -n 1)"
                  test -n "$latest_backup"
                  rclone copyto \
                    "oci:${BACKUP_BUCKET}/postgres/${latest_backup}" \
                    "/work/${latest_backup}"
                  rclone copyto \
                    "oci:${BACKUP_BUCKET}/postgres/${latest_backup}.sha256" \
                    "/work/${latest_backup}.sha256"
                  cd /work
                  sha256sum -c "${latest_backup}.sha256"
              env:
                - {name: BACKUP_BUCKET, value: dukly-db-backups}
                - {name: RCLONE_CONFIG, value: /tmp/rclone.conf}
                - {name: RCLONE_CONFIG_OCI_TYPE, value: s3}
                - {name: RCLONE_CONFIG_OCI_PROVIDER, value: Other}
                - {name: RCLONE_CONFIG_OCI_ENV_AUTH, value: "true"}
                - {name: RCLONE_CONFIG_OCI_REGION, value: ap-hyderabad-1}
                - {name: RCLONE_CONFIG_OCI_ENDPOINT, value: https://axbcwhek7zcg.compat.objectstorage.ap-hyderabad-1.oraclecloud.com}
                - {name: RCLONE_CONFIG_OCI_USE_PRESIGNED_REQUEST, value: "true"}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: {name: localshops-db-backups, key: access-key-id}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: localshops-db-backups, key: secret-access-key}
              resources:
                requests: {cpu: 10m, memory: 64Mi}
                limits: {memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
                readOnlyRootFilesystem: true
              volumeMounts:
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: restore-check
              image: docker.io/library/postgres@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
              imagePullPolicy: IfNotPresent
              command: ["sh", "-ec"]
              args:
                - |
                  latest_backup="$(find /work -maxdepth 1 -type f -name 'localshops-*.dump' -print | sort | tail -n 1)"
                  test -n "$latest_backup"

                  mkdir -p /restore/data /restore/socket
                  initdb \
                    --pgdata=/restore/data \
                    --auth=trust \
                    --no-locale \
                    --encoding=UTF8 >/dev/null
                  pg_ctl \
                    --pgdata=/restore/data \
                    --options="-k /restore/socket -p 55432 -c listen_addresses=''" \
                    --wait start >/dev/null
                  cleanup() {
                    pg_ctl --pgdata=/restore/data --mode=fast --wait stop >/dev/null
                  }
                  trap cleanup EXIT

                  createdb --host=/restore/socket --port=55432 restore_check
                  pg_restore \
                    --host=/restore/socket \
                    --port=55432 \
                    --dbname=restore_check \
                    --exit-on-error \
                    --no-owner \
                    --no-privileges \
                    "$latest_backup"
                  table_count="$(psql \
                    --host=/restore/socket \
                    --port=55432 \
                    --dbname=restore_check \
                    --tuples-only \
                    --no-align \
                    --command="SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';")"
                  test "$table_count" -gt 0
                  echo "Restore verification succeeded: ${table_count} public tables from ${latest_backup}"
              resources:
                requests: {cpu: 10m, memory: 96Mi}
                limits: {memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
                readOnlyRootFilesystem: true
              volumeMounts:
                - {name: work, mountPath: /work, readOnly: true}
                - {name: restore, mountPath: /restore}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: work
              emptyDir: {sizeLimit: 1Gi}
            - name: restore
              emptyDir: {sizeLimit: 1Gi}
            - name: tmp
              emptyDir: {sizeLimit: 128Mi}
