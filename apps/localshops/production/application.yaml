apiVersion: v1
kind: Service
metadata: {name: api, namespace: localshops}
spec:
  selector: {app.kubernetes.io/name: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: localshops}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: api}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: bhuplabs-local}
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets: [{name: ocir-pull}]
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app.kubernetes.io/name: api}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app.kubernetes.io/name: api}}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: localshops-api
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: localshops-config}}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: localshops-database, key: url}}
            - name: RATE_LIMIT_REDIS_URL
              valueFrom: {secretKeyRef: {name: localshops-runtime, key: redis-url}}
            - name: VAPID_PUBLIC_KEY
              valueFrom: {secretKeyRef: {name: localshops-vapid, key: public-key}}
            - name: MEDIA_S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: localshops-media, key: access-key-id}}
            - name: MEDIA_S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: localshops-media, key: secret-access-key}}
          ports: [{name: http, containerPort: 8000}]
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 512Mi}
          startupProbe: {httpGet: {path: /health/live, port: http}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 15}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: temporary-files, mountPath: /tmp}
          lifecycle: {preStop: {exec: {command: ["sh", "-c", "sleep 5"]}}}
      volumes:
        - name: temporary-files
          emptyDir: {medium: Memory, sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: localshops}
spec:
  selector: {app.kubernetes.io/name: web}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: localshops}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: web}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: web, app.kubernetes.io/part-of: bhuplabs-local}
    spec:
      serviceAccountName: web
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets: [{name: ocir-pull}]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app.kubernetes.io/name: web}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: {matchLabels: {app.kubernetes.io/name: web}}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: localshops-web
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: localshops-config}}]
          env:
            - name: SESSION_REDIS_URL
              valueFrom: {secretKeyRef: {name: localshops-runtime, key: redis-url}}
          ports: [{name: http, containerPort: 3000}]
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {memory: 384Mi}
          startupProbe: {httpGet: {path: /api/health, port: http}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 15}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
          lifecycle: {preStop: {exec: {command: ["sh", "-c", "sleep 5"]}}}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: next-cache, mountPath: /app/.next/cache}]
      volumes: [{name: tmp, emptyDir: {}}, {name: next-cache, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: notification-worker, namespace: localshops}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: notification-worker}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: notification-worker, app.kubernetes.io/part-of: bhuplabs-local}
    spec:
      serviceAccountName: notification-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets: [{name: ocir-pull}]
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: localshops-api
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          envFrom: [{configMapRef: {name: localshops-config}}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: localshops-database, key: url}}
            - name: VAPID_PUBLIC_KEY
              valueFrom: {secretKeyRef: {name: localshops-vapid, key: public-key}}
            - name: VAPID_PRIVATE_KEY
              valueFrom: {secretKeyRef: {name: localshops-vapid, key: private-key}}
          resources:
            requests: {cpu: 10m, memory: 80Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: localshops}
spec: {minAvailable: 1, selector: {matchLabels: {app.kubernetes.io/name: api}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: web, namespace: localshops}
spec: {minAvailable: 1, selector: {matchLabels: {app.kubernetes.io/name: web}}}
