apiVersion: batch/v1
kind: Job
metadata:
  name: localshops-migrate-31736c9
  namespace: localshops
  labels: {app.kubernetes.io/name: migration}
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: migration}
    spec:
      serviceAccountName: database-maintenance
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      imagePullSecrets: [{name: ocir-pull}]
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          # Completed Jobs are immutable. Pin the image that ran this migration;
          # a future schema change must use a new Job name and image digest.
          image: hyd.ocir.io/axbcwhek7zcg/localshops-api@sha256:e075af4402c942f1dbc933adf2810f9fd3418f61401225ea6b273582dc66dd79
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args: ["alembic upgrade head && python -m app.bootstrap_admin"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: localshops-database, key: url}}
          envFrom: [{secretRef: {name: localshops-platform-admin}}]
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}, readOnlyRootFilesystem: true}
