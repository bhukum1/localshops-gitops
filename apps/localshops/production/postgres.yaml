apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: oci-bv-retain
provisioner: blockvolume.csi.oraclecloud.com
parameters:
  attachment-type: paravirtualized
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: localshops
  labels: {app.kubernetes.io/name: postgres}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: localshops
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: oci-bv-retain
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: localshops
  labels: {app.kubernetes.io/name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: bhuplabs-local
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-bookworm
          imagePullPolicy: IfNotPresent
          env:
            - {name: POSTGRES_DB, value: localshops}
            - {name: POSTGRES_USER, value: localshops}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: localshops-database, key: password}}
            - {name: POSTGRES_INITDB_ARGS, value: --auth-host=scram-sha-256}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: postgres, containerPort: 5432}]
          resources:
            requests: {cpu: 25m, memory: 192Mi}
            limits: {memory: 768Mi}
          startupProbe:
            exec: {command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U localshops -d localshops"]}
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U localshops -d localshops"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U localshops -d localshops"]}
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
