apiVersion: v1
kind: Namespace
metadata:
  name: localshops-dev-bridge
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: bridge-budget, namespace: localshops-dev-bridge}
spec:
  hard:
    pods: "5"
    requests.cpu: 100m
    requests.memory: 256Mi
    limits.cpu: 500m
    limits.memory: 512Mi
    services: "3"
---
apiVersion: v1
kind: LimitRange
metadata: {name: default-resources, namespace: localshops-dev-bridge}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 10m, memory: 32Mi}
      default: {cpu: 100m, memory: 96Mi}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: legacy-dev-bridge, namespace: localshops-dev-bridge}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: {name: legacy-dev-bridge, namespace: localshops-dev-bridge}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr notice;
    events {}
    http {
      access_log /dev/stdout;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      server {
        listen 8080;
        server_name dev-shops.bhuplabs.dev dev-app.bhuplabs.dev dev-api.bhuplabs.dev;

        location = /bridge-health {
          access_log off;
          default_type text/plain;
          return 200 "ok\n";
        }

        location / {
          proxy_pass https://10.0.0.169:443;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_ssl_server_name on;
          proxy_ssl_name $host;
          proxy_ssl_verify on;
          proxy_ssl_verify_depth 2;
          proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
          proxy_connect_timeout 5s;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata: {name: legacy-dev-bridge, namespace: localshops-dev-bridge}
spec:
  selector: {app.kubernetes.io/name: legacy-dev-bridge}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: legacy-dev-bridge, namespace: localshops-dev-bridge}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: legacy-dev-bridge}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legacy-dev-bridge
        app.kubernetes.io/part-of: bhuplabs-local
    spec:
      serviceAccountName: legacy-dev-bridge
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: proxy
          image: docker.io/nginxinc/nginx-unprivileged@sha256:044acf9fd345f73fe66d818e043fd601982f0ab5ae14213c5bdaccd5ffaa065d
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
          startupProbe: {httpGet: {path: /bridge-health, port: http}, failureThreshold: 15, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /bridge-health, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /bridge-health, port: http}, periodSeconds: 15}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: legacy-dev-bridge}
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: localshops-dev-tls, namespace: localshops-dev-bridge}
spec:
  secretName: localshops-dev-tls
  dnsNames: [dev-shops.bhuplabs.dev, dev-app.bhuplabs.dev, dev-api.bhuplabs.dev]
  issuerRef: {kind: ClusterIssuer, name: letsencrypt-prod}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-dev-bridge
  namespace: localshops-dev-bridge
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  tls:
    - secretName: localshops-dev-tls
      hosts: [dev-shops.bhuplabs.dev, dev-app.bhuplabs.dev, dev-api.bhuplabs.dev]
  rules:
    - host: dev-shops.bhuplabs.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: legacy-dev-bridge, port: {number: 8080}}}
    - host: dev-app.bhuplabs.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: legacy-dev-bridge, port: {number: 8080}}}
    - host: dev-api.bhuplabs.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: legacy-dev-bridge, port: {number: 8080}}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: localshops-dev-bridge}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: traefik-ingress, namespace: localshops-dev-bridge}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: legacy-dev-bridge}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: legacy-dev-egress, namespace: localshops-dev-bridge}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: legacy-dev-bridge}}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 10.0.0.169/32}}]
      ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: acme-solver-ingress, namespace: localshops-dev-bridge}
spec:
  podSelector: {matchLabels: {acme.cert-manager.io/http01-solver: "true"}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: traefik}}
