apiVersion: v1
kind: Service
metadata:
  name: session-redis
  labels:
    app.kubernetes.io/name: session-redis
spec:
  selector:
    app.kubernetes.io/name: session-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-redis
  labels:
    app.kubernetes.io/name: session-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: session-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-redis
        app.kubernetes.io/part-of: bhuplabs-local
    spec:
      serviceAccountName: session-redis
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.2-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - exec redis-server --save '' --appendonly no --maxmemory 96mb --maxmemory-policy noeviction --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: localshops-oidc
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 20m
              memory: 40Mi
            limits:
              cpu: 200m
              memory: 144Mi
          readinessProbe:
            exec:
              command: ["sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-ec", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
