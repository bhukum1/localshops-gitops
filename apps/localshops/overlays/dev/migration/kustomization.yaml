    newName: ocir.us-ashburn-1.oci.oraclecloud.com/idcnbp9cfade/localshops-api
    digest: sha256:5c03019772c8eabd8b1d52f2ab95b3087124f4d5e910f5b2bb09b2c947d42b8b
patches:
  - target:
      kind: Job
      name: localshops-migrate
