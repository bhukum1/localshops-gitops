apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: localshops-dev
resources:
  - ../../../base/migration
images:
  - name: localshops-api
    newName: ocir.us-ashburn-1.oci.oraclecloud.com/idcnbp9cfade/localshops-api
    digest: sha256:0a5e94c532458ac48e70901f762d86274cffb14885bf5dc1e8e3f397fdc87d8f
patches:
  - target:
      kind: Job
      name: localshops-migrate
