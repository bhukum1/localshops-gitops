apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: localshops-dev
resources:
  - ../../../base/data
patches:
  - target:
      kind: PersistentVolumeClaim
      name: postgres-data
    patch: |-
      - op: add
        path: /spec/volumeName
        value: localshops-dev-postgres-pv-node01
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: node01
  - target:
      kind: Deployment
      name: session-redis
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: node02
