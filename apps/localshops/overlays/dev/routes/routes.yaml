apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: localshops-tls
spec:
  secretName: localshops-tls
  dnsNames:
    - dev-shops.bhuplabs.dev
    - dev-app.bhuplabs.dev
    - dev-api.bhuplabs.dev
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: localshops
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  tls:
    - secretName: localshops-tls
      hosts:
        - dev-shops.bhuplabs.dev
        - dev-app.bhuplabs.dev
        - dev-api.bhuplabs.dev
  rules:
    - host: dev-shops.bhuplabs.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 3000}
    - host: dev-app.bhuplabs.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 3000}
    - host: dev-api.bhuplabs.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port: {number: 8000}
