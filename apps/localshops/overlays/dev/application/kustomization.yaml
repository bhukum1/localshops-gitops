apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: localshops-dev
resources:
  - ../../../base/application
  - config.yaml
  - pod-disruption-budgets.yaml
  - release.yaml
images:
  - name: localshops-api
    newName: hyd.ocir.io/axbcwhek7zcg/localshops-api
    digest: sha256:701fc1cd36ba9fad8ed0c16fcbf7b55b56090072117bad6724956b5176d49fd5
  - name: localshops-web
    newName: hyd.ocir.io/axbcwhek7zcg/localshops-web
    digest: sha256:04a1c5786ccb3e32d6bca477fb9195e5393ef5546f00a8bfe565b557eb28833c
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
          rollingUpdate: null
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
          rollingUpdate: null
  - target:
      kind: Deployment
      name: notification-worker
    patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
          rollingUpdate: null
