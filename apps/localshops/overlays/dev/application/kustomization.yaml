apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: localshops-dev
resources:
  - ../../../base/application
  - config.yaml
  - release.yaml
images:
  - name: localshops-api
    newName: ocir.us-ashburn-1.oci.oraclecloud.com/idcnbp9cfade/localshops-api
    digest: sha256:392dcdf99009a371b538be38df0d8cc79ec6d8a82ec99365ae9ca60774a83c8d
  - name: localshops-web
    newName: ocir.us-ashburn-1.oci.oraclecloud.com/idcnbp9cfade/localshops-web
    digest: sha256:d8587d15d43f61735f2836beab58b1bbd1d471c09ca875f1d844b57d22ca7b2c
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: node02
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: node02
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
