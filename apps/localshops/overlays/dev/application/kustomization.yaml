apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: localshops-dev
resources:
  - ../../../base/application
  - config.yaml
  - pod-disruption-budgets.yaml
  - release.yaml
images:
  - name: localshops-api
    newName: hyd.ocir.io/axbcwhek7zcg/localshops-api
    digest: sha256:9551deaf5d1923e087883c05eb2cc469b4deb77b09694ada038289d24d983861
  - name: localshops-web
    newName: hyd.ocir.io/axbcwhek7zcg/localshops-web
    digest: sha256:250fc96c6f3485f87f49af9e976cd37349de3341c468820bf35a42890cb8838b
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
          rollingUpdate: null
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
          rollingUpdate: null
  - target:
      kind: Deployment
      name: notification-worker
    patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
          rollingUpdate: null
