apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: localshops-dev
resources:
  - ../../../base/application
  - config.yaml
  - pod-disruption-budgets.yaml
  - release.yaml
images:
  - name: localshops-api
    newName: hyd.ocir.io/axbcwhek7zcg/localshops-api
    digest: sha256:4256b9e1a00eaf85175472a69d23957f83a3005c697fc01e2e9b85182e8140a9
  - name: localshops-web
    newName: hyd.ocir.io/axbcwhek7zcg/localshops-web
    digest: sha256:4f3ff1998cfc10a57630c6078fc627554f8053e7adf4c8b5838a3defc6ac5d46
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
          rollingUpdate: null
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
          rollingUpdate: null
  - target:
      kind: Deployment
      name: notification-worker
    patch: |-
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
          rollingUpdate: null
