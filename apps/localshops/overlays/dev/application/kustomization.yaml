apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: localshops-dev
resources:
  - ../../../base/application
  - config.yaml
  - release.yaml
images:
  - name: localshops-api
    newName: ocir.us-ashburn-1.oci.oraclecloud.com/idcnbp9cfade/localshops-api
    digest: sha256:081d2a4a038b7770a09e6479450bce22e270aad682f16ff2a79da7650c8933c5
  - name: localshops-web
    newName: ocir.us-ashburn-1.oci.oraclecloud.com/idcnbp9cfade/localshops-web
    digest: sha256:a6b0a76c3cc25b6b0dcaab6592483a77195d7934c4cff2ed68bad0275cba835f
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: node02
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: node02
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
