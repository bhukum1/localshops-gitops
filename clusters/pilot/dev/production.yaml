apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: localshops-production
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/localshops/production
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: api
      namespace: localshops
    - apiVersion: apps/v1
      kind: Deployment
      name: web
      namespace: localshops
    - apiVersion: apps/v1
      kind: StatefulSet
      name: postgres
      namespace: localshops
