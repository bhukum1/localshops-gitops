apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: localshops-dev-data
  namespace: flux-system
spec:
  dependsOn:
    - name: localshops-dev-infrastructure
  interval: 10m
  retryInterval: 1m
  path: ./apps/localshops/overlays/dev/data
  prune: true
  serviceAccountName: localshops-dev-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: localshops-dev
  timeout: 5m
  wait: true
